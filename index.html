<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>标准答案中心</title>
  <style>
    :root{--primary:#3568f4;--primary2:#5b7df7;--bg:#eef3fb;--panel:#fff;--soft:#f6f8fc;--line:#d9e1ef;--text:#11213c;--muted:#6b7890;--danger:#dc3d4f;--shadow:0 16px 46px rgba(24,44,84,.14)}*{box-sizing:border-box}body{margin:0;font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:var(--text);background:var(--bg)}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,#dce7ff,transparent 32%),linear-gradient(145deg,#eef4ff,#f7f9fd)}.login-card{width:min(430px,94vw);padding:34px;border:1px solid var(--line);border-radius:22px;background:var(--panel);box-shadow:var(--shadow)}.brand{display:flex;align-items:center;gap:12px}.brand-icon{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;color:#fff;background:linear-gradient(135deg,var(--primary),#7457ef);font-weight:900}.login h1{margin:22px 0 7px;font-size:28px}.login p{margin:0 0 22px;color:var(--muted)}.login label{display:grid;gap:7px;margin:13px 0;color:var(--muted);font-size:13px}.field{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;color:var(--text);background:var(--soft);outline:0}.field:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(53,104,244,.12)}.primary{border:0!important;color:#fff!important;background:var(--primary)!important}.login button{width:100%;margin-top:12px;border:0;border-radius:11px;padding:12px}.error{min-height:21px;margin-top:10px;color:var(--danger);font-size:13px}.shell{min-height:100vh;display:grid;grid-template-rows:68px 1fr}.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line);background:var(--panel)}.top-actions{display:flex;align-items:center;gap:9px}.top-actions button,.ghost{border:1px solid var(--line);border-radius:9px;padding:8px 12px;color:var(--text);background:var(--panel)}.avatar{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;color:#fff;background:var(--primary);font-weight:800}.workspace{display:grid;grid-template-columns:300px 330px minmax(420px,1fr);min-height:0}.problem-pane,.choice-pane,.answer-pane{min-width:0;border-right:1px solid var(--line);background:var(--panel)}.problem-pane{padding:18px;background:var(--soft)}.search{display:flex;align-items:center;gap:8px;margin-bottom:14px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--panel)}.search input{width:100%;border:0;outline:0;background:transparent}.pane-title{display:flex;justify-content:space-between;margin:10px 4px;color:var(--muted);font-size:13px}.problem-list{display:grid;gap:7px;max-height:calc(100vh - 160px);overflow:auto}.problem{display:grid;grid-template-columns:32px 1fr;gap:9px;border:1px solid transparent;border-radius:11px;padding:11px;text-align:left;color:var(--text);background:transparent}.problem.active{border-color:#c9d7ff;background:#e5ecff}.problem b:first-child{color:var(--primary);font-size:17px}.problem span{display:grid;gap:3px}.problem small{color:var(--muted)}.choice-pane{padding:26px 24px}.current-label{color:var(--muted);font-size:12px}.choice-pane h2{margin:8px 0 22px}.choice-block{padding:20px 0;border-top:1px solid var(--line)}.choice-head{display:flex;align-items:center;gap:10px;margin-bottom:13px}.choice-head b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;color:#fff;background:var(--primary)}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);border-radius:999px;padding:9px 14px;color:var(--text);background:var(--panel)}.chip.active{border-color:var(--primary);color:#fff;background:var(--primary)}.answer-pane{padding:28px;overflow:auto}.answer-card{max-width:860px;margin:auto;border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:0 8px 28px rgba(23,42,77,.08);overflow:hidden}.answer-meta{padding:20px 24px;border-bottom:1px solid var(--line)}.answer-meta small{color:var(--muted)}.answer-meta h2{margin:8px 0 0}.answer-body{padding:24px}.answer-image{display:block;max-width:min(100%,620px);max-height:520px;margin:0 auto 22px;border-radius:12px;object-fit:contain}.answer-text{white-space:pre-wrap;line-height:1.8}.copy-actions{display:flex;gap:10px;margin-top:22px}.copy-actions button{border:1px solid var(--line);border-radius:10px;padding:10px 15px;color:var(--text);background:var(--panel)}.empty{display:grid;place-items:center;min-height:300px;color:var(--muted)}.admin{position:fixed;inset:0;z-index:50;overflow:auto;background:var(--bg)}.admin-head{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--line);background:var(--panel)}.admin-head h2{margin:0}.admin-tabs{display:flex;gap:7px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--panel)}.admin-tabs button{border:1px solid var(--line);border-radius:9px;padding:8px 12px;color:var(--text);background:var(--panel)}.admin-tabs button.active{color:#fff;background:var(--primary)}.admin-content{padding:22px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.toolbar h3{margin:0}.toolbar-actions{display:flex;gap:8px;flex-wrap:wrap}.toolbar button,.row-actions button,.modal footer button,.order-row button{border:1px solid var(--line);border-radius:8px;padding:8px 11px;color:var(--text);background:var(--panel)}.bulkbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;border:1px solid #bdcdfd;border-radius:10px;padding:10px 12px;background:#edf2ff}.bulkbar span{flex:1;color:var(--muted)}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:13px}th{color:var(--muted);background:var(--soft)}td.answer-cell{max-width:360px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.selected td{background:#f0f4ff}.danger{color:var(--danger)!important}.row-actions{display:flex;gap:6px}.modalback{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:22px;background:rgba(8,18,37,.64)}.modal{width:min(760px,94vw);max-height:92vh;overflow:auto;border-radius:18px;background:var(--panel);box-shadow:var(--shadow)}.modal header,.modal footer{display:flex;align-items:center;justify-content:space-between;padding:17px 20px;border-bottom:1px solid var(--line)}.modal footer{justify-content:flex-end;gap:8px;border-top:1px solid var(--line);border-bottom:0}.modal h2,.modal p{margin:0}.modal p{margin-top:4px;color:var(--muted);font-size:13px}.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:20px}.modal-grid label{display:grid;gap:6px;color:var(--muted);font-size:12px}.wide{grid-column:1/-1}.modal textarea{min-height:120px;resize:vertical}.readonly{color:var(--primary);font-weight:800}.warning{grid-column:1/-1;border:1px solid #f4b23a;border-radius:9px;padding:10px;color:#8a5100;background:#fff9e9}.order-list,.card-list{display:grid;gap:8px;padding:18px}.order-row,.card{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--soft)}.order-row div,.card div{flex:1;display:grid;gap:3px}.order-row small,.card small{color:var(--muted)}.user-form{display:grid;grid-template-columns:1fr 1fr 1fr 150px auto;gap:8px;margin-bottom:15px}.toast{position:fixed;left:50%;bottom:22px;z-index:200;padding:10px 16px;border-radius:999px;color:#fff;background:#172236;opacity:0;transform:translate(-50%,14px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:1050px){.workspace{grid-template-columns:240px 280px 1fr}.user-form{grid-template-columns:1fr 1fr}}@media(max-width:760px){.workspace{grid-template-columns:1fr}.problem-pane,.choice-pane{border-bottom:1px solid var(--line)}.problem-list{max-height:260px}.modal-grid{grid-template-columns:1fr}.wide{grid-column:auto}.topbar{padding:0 12px}.top-actions span:not(.avatar){display:none}}
  </style>
</head>
<body>
  <section id="loginView" class="login">
    <form id="loginForm" class="login-card">
      <div class="brand"><div class="brand-icon">答</div><strong>标准答案中心</strong></div>
      <h1>登录公司工具</h1><p>使用管理员建立的账号与密码</p>
      <label>账号<input id="loginUser" class="field" autocomplete="username" required></label>
      <label>密码<input id="loginPassword" class="field" type="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">登录</button><div id="loginError" class="error"></div>
    </form>
  </section>
  <main id="appView" class="shell hidden">
    <header class="topbar"><div class="brand"><div class="brand-icon">答</div><strong>标准答案中心</strong></div><div class="top-actions"><span id="userName"></span><span id="avatar" class="avatar"></span><button id="editorCreateButton" class="hidden">＋ 提出新增</button><button id="myDraftsButton" class="hidden">我的申请</button><button id="adminButton" class="hidden">管理后台</button><button id="logoutButton">退出</button></div></header>
    <section class="workspace">
      <aside class="problem-pane"><div class="search">⌕<input id="searchInput" placeholder="搜索问题编号或关键词"></div><div class="pane-title"><span>问题列表</span><b id="problemCount">0</b></div><div id="problemList" class="problem-list"></div></aside>
      <aside id="choicePane" class="choice-pane"></aside><section id="answerPane" class="answer-pane"></section>
    </section>
  </main>
  <section id="adminView" class="admin hidden"><header class="admin-head"><h2>管理后台</h2><button class="ghost" onclick="app.closeAdmin()">返回标准答案中心</button></header><nav id="adminTabs" class="admin-tabs"></nav><div id="adminContent" class="admin-content"></div></section>
  <div id="modalRoot"></div><div id="toast" class="toast"></div>
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
    const SB_URL="https://ehunehldizwnissqjnmo.supabase.co";
    const SB_KEY="sb_publishable_V2SulLXaBuXNVAOuPwR6kQ_FlN0w7dM";
    const API=SB_URL+"/functions/v1/team-api";
    const supabase=createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
    const state={data:null,query:"",problem:null,situation:null,platform:null,adminTab:"answers",selected:new Set(),editor:null,image:null};
    const $=id=>document.getElementById(id); const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const usernameEmail=u=>u.trim().toLowerCase()+"@team-answer.local";
    function notify(message){const t=$("toast");t.textContent=message;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)}
    async function session(){return (await supabase.auth.getSession()).data.session}
    async function request(body=null,form=null){const s=await session();if(!s)throw new Error("登录已失效");const options={method:body||form?"POST":"GET",headers:{apikey:SB_KEY,Authorization:"Bearer "+s.access_token}};if(body){options.headers["content-type"]="application/json";options.body=JSON.stringify(body)}if(form)options.body=form;const r=await fetch(API,options);const data=await r.json();if(r.status===401){await supabase.auth.signOut();showLogin();throw new Error("登录已失效")}if(!r.ok)throw new Error(data.error||"操作失败");return data}
    async function load(){state.data=await request();const codes=new Set(state.data.items.map(x=>x.problem_code));if(!codes.has(state.problem))state.problem=state.data.items[0]?.problem_code||null;render();if(!$("adminView").classList.contains("hidden"))renderAdmin()}
    function problems(){const map=new Map();for(const item of state.data?.items||[]){if(!map.has(item.problem_code))map.set(item.problem_code,{code:item.problem_code,title:item.problem_title,items:[]});map.get(item.problem_code).items.push(item)}const q=state.query.trim().toLowerCase();return [...map.values()].filter(p=>!q||(p.code+" "+p.title+" "+p.items.map(i=>i.situation_label+" "+(i.platform||"")+" "+i.answer_text).join(" ")).toLowerCase().includes(q))}
    function current(){const ps=problems();const p=ps.find(x=>x.code===state.problem)||ps[0];if(!p)return{};state.problem=p.code;const situations=[...new Set(p.items.map(i=>i.situation_label))];if(!situations.includes(state.situation))state.situation=situations[0];const items=p.items.filter(i=>i.situation_label===state.situation);const platforms=[...new Set(items.map(i=>i.platform).filter(Boolean))];if(!platforms.includes(state.platform))state.platform=platforms[0]||null;return{p,situations,items,platforms,answer:items.find(i=>platforms.length?i.platform===state.platform:!i.platform)||items[0]}}
    function render(){if(!state.data)return;const isEditor=state.data.user.role==="editor",isAdmin=state.data.user.role==="admin";$("userName").textContent=state.data.user.display_name;$("avatar").textContent=state.data.user.display_name.slice(0,1);$("editorCreateButton").classList.toggle("hidden",!isEditor);$("myDraftsButton").classList.toggle("hidden",!isEditor);$("adminButton").classList.toggle("hidden",!isAdmin);const ps=problems();$("problemCount").textContent=ps.length;$("problemList").innerHTML=ps.map(p=>`<button class="problem ${p.code===state.problem?'active':''}" onclick="app.problem('${esc(p.code)}')"><b>${esc(p.code)}</b><span><strong>${esc(p.title)}</strong><small>${new Set(p.items.map(i=>i.situation_label)).size} 种情况</small></span></button>`).join("");const c=current();if(!c.p){$("choicePane").innerHTML='<div class="empty">没有答案</div>';$("answerPane").innerHTML='';return}$("choicePane").innerHTML=`<span class="current-label">当前问题</span><h2>${esc(c.p.code)}｜${esc(c.p.title)}</h2><div class="choice-block"><div class="choice-head"><b>1</b><strong>选择查询到的情况</strong></div><div class="chips">${c.situations.map(s=>`<button class="chip ${s===state.situation?'active':''}" onclick="app.situation('${esc(s)}')">${esc(s)}</button>`).join("")}</div></div>${c.platforms.length?`<div class="choice-block"><div class="choice-head"><b>2</b><strong>选择会员所在平台</strong></div><div class="chips">${c.platforms.map(p=>`<button class="chip ${p===state.platform?'active':''}" onclick="app.platform('${esc(p)}')">${esc(p)}</button>`).join("")}</div></div>`:""}`;const a=c.answer;$("answerPane").innerHTML=a?`<article class="answer-card"><div class="answer-meta"><small>答案 ${esc(a.answer_code)} · v${a.version}</small><h2>${a.platform?esc(a.platform)+'平台｜':''}${esc(a.problem_title)}</h2></div><div class="answer-body">${a.image_url?`<img class="answer-image" src="${esc(a.image_url)}" alt="答案附图">`:""}<div class="answer-text">${esc(a.answer_text)}</div><div class="copy-actions"><button onclick="app.copyText(${a.id})">复制文字</button>${a.image_url?`<button class="primary" onclick="app.copyBoth(${a.id})">复制图片＋文字</button>`:""}${isEditor?`<button onclick="app.edit(${a.id})">提出修改</button>`:isAdmin?`<button onclick="app.edit(${a.id})">修改答案</button>`:""}</div></div></article>`:'<div class="empty">请选择情况与平台</div>'}
    async function copyText(id){const a=state.data.items.find(x=>x.id===id);await navigator.clipboard.writeText(a.answer_text);notify("文字已复制")}
    async function copyBoth(id){const a=state.data.items.find(x=>x.id===id);if(!a.image_url)return copyText(id);try{const source=await fetch(a.image_url).then(r=>r.blob());const dataUrl=await new Promise((ok,no)=>{const f=new FileReader();f.onload=()=>ok(f.result);f.onerror=no;f.readAsDataURL(source)});const image=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=dataUrl});const canvas=document.createElement("canvas");canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;canvas.getContext("2d").drawImage(image,0,0);const png=await new Promise(ok=>canvas.toBlob(ok,"image/png"));const text=esc(a.answer_text).replace(/\n/g,"<br>");const html=`<div><img src="${dataUrl}"><br><div>${text}</div></div>`;await navigator.clipboard.write([new ClipboardItem({"image/png":png,"text/html":new Blob([html],{type:"text/html"}),"text/plain":new Blob([a.answer_text],{type:"text/plain"})})]);notify("图片＋文字已复制（图片在前）")}catch{await copyText(id);notify("浏览器无法复制图片，已改为复制文字")}}
    function showLogin(){$("loginView").classList.remove("hidden");$("appView").classList.add("hidden");$("adminView").classList.add("hidden")}
    function showApp(){$("loginView").classList.add("hidden");$("appView").classList.remove("hidden")}
    function openAdmin(){state.adminTab="answers";state.selected.clear();$("adminView").classList.remove("hidden");renderAdmin()}
    function closeAdmin(){$("adminView").classList.add("hidden");render()}
    const adminTabs=[['answers','答案管理'],['drafts','待审核'],['users','账号权限'],['recycle','回收站'],['history','版本历史'],['audit','操作记录']];
    function renderAdmin(){const d=state.data;$("adminTabs").innerHTML=adminTabs.map(([k,l])=>`<button class="${state.adminTab===k?'active':''}" onclick="app.tab('${k}')">${l}</button>`).join("");const root=$("adminContent");if(state.adminTab==='answers'){root.innerHTML=`<div class="toolbar"><div><h3>标准答案资料</h3><small>勾选多笔可批量整理</small></div><div class="toolbar-actions"><button onclick="app.orderModal()">调整问题顺序</button><button class="primary" onclick="app.edit()">＋ 新增答案</button></div></div>${state.selected.size?`<div class="bulkbar"><b>已选择 ${state.selected.size} 笔</b><span>可统一修改问题分类、情况或平台</span><button class="primary" onclick="app.bulkModal()">批量整理</button><button onclick="app.clearSelection()">取消</button></div>`:""}<div class="tablewrap"><table><thead><tr><th><input type="checkbox" ${state.selected.size===d.items.length&&d.items.length?'checked':''} onchange="app.selectAll(this.checked)"></th><th>答案编号</th><th>问题</th><th>情况</th><th>平台</th><th>标准答案</th><th>操作</th></tr></thead><tbody>${d.items.map(i=>`<tr class="${state.selected.has(i.id)?'selected':''}"><td><input type="checkbox" ${state.selected.has(i.id)?'checked':''} onchange="app.select(${i.id},this.checked)"></td><td><b>${esc(i.answer_code)}</b></td><td>${esc(i.problem_code)}｜${esc(i.problem_title)}</td><td>${esc(i.situation_label)}</td><td>${esc(i.platform||'通用')}</td><td class="answer-cell">${esc(i.answer_text)}</td><td><div class="row-actions"><button onclick="app.edit(${i.id})">修改</button><button class="danger" onclick="app.remove(${i.id})">删除</button></div></td></tr>`).join("")}</tbody></table></div>`}
      else if(state.adminTab==='users'){root.innerHTML=`<div class="toolbar"><h3>公司账号与权限</h3></div><div class="user-form"><input id="newUsername" class="field" placeholder="登录账号"><input id="newDisplay" class="field" placeholder="显示名称"><input id="newPassword" class="field" type="password" placeholder="初始密码"><select id="newRole" class="field"><option value="viewer">只读使用者</option><option value="editor">编辑者</option><option value="admin">管理员</option></select><button class="primary" onclick="app.createUser()">建立账号</button></div><div class="card-list">${(d.users||[]).map(u=>`<article class="card"><div><strong>${esc(u.display_name)}</strong><small>${esc(u.username)}</small></div><select onchange="app.updateUser('${u.id}',this.value,'${u.status}')"><option value="viewer" ${u.role==='viewer'?'selected':''}>只读</option><option value="editor" ${u.role==='editor'?'selected':''}>编辑者</option><option value="admin" ${u.role==='admin'?'selected':''}>管理员</option></select><select onchange="app.updateUser('${u.id}','${u.role}',this.value)"><option value="active" ${u.status==='active'?'selected':''}>使用中</option><option value="disabled" ${u.status==='disabled'?'selected':''}>已停用</option></select><button onclick="app.resetPassword('${u.id}','${esc(u.display_name)}')">重置密码</button></article>`).join("")}</div>`}
      else if(state.adminTab==='drafts'){root.innerHTML=`<div class="card-list">${(d.drafts||[]).length?(d.drafts||[]).map(x=>`<article class="card"><div><strong>${esc(x.proposed_json?.answer_code||'新答案')}｜${esc(x.proposed_json?.problem_title)}</strong><small>${esc(x.proposed_json?.answer_text)}</small></div><button class="primary" onclick="app.draft(${x.id},true)">通过</button><button onclick="app.draft(${x.id},false)">退回</button></article>`).join(""):'<div class="empty">目前没有待审核草稿</div>'}</div>`}
      else if(state.adminTab==='recycle'){root.innerHTML=`<div class="card-list">${(d.deleted_items||[]).length?(d.deleted_items||[]).map(x=>`<article class="card"><div><strong>${esc(x.answer_code)}｜${esc(x.problem_title)}</strong><small>${esc(x.answer_text)}</small></div><button class="primary" onclick="app.restore(${x.id})">恢复</button></article>`).join(""):'<div class="empty">回收站目前是空的</div>'}</div>`}
      else if(state.adminTab==='history'){root.innerHTML=`<div class="card-list">${(d.history||[]).map(x=>`<article class="card"><div><strong>答案 #${x.answer_item_id} · v${x.version}</strong><small>${esc(x.action)} · ${new Date(x.created_at).toLocaleString()}</small></div><button onclick="app.restoreHistory(${x.id})">恢复此版本</button></article>`).join("")||'<div class="empty">暂无历史版本</div>'}</div>`}
      else root.innerHTML=`<div class="tablewrap"><table><thead><tr><th>时间</th><th>人员</th><th>操作</th><th>对象</th></tr></thead><tbody>${(d.audit||[]).map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${esc(x.actor_name)}</td><td>${esc(x.action)}</td><td>${esc(x.entity_type)} #${esc(x.entity_id)}</td></tr>`).join("")}</tbody></table></div>`}
    function modal(html){$("modalRoot").innerHTML=`<div class="modalback" onclick="if(event.target===this)app.closeModal()"><section class="modal">${html}</section></div>`}function closeModal(){$("modalRoot").innerHTML="";state.editor=null;state.image=null}
    function distinct(key){return[...new Set(state.data.items.map(x=>x[key]).filter(Boolean))]}
    function numbering(e){const items=state.data.items.filter(x=>x.id!==e.id),sameProblem=items.find(x=>norm(x.problem_title)===norm(e.problem_title));const p=sameProblem?.problem_code||String(Math.max(0,...items.map(x=>Number(x.problem_code)||0))+1),pis=items.filter(x=>x.problem_code===p),sameSituation=pis.find(x=>norm(x.situation_label)===norm(e.situation_label)),s=sameSituation?Number((sameSituation.answer_code||'').split('-')[1])||1:Math.max(0,...pis.map(x=>Number((x.answer_code||'').split('-')[1])||0))+1,sis=pis.filter(x=>norm(x.situation_label)===norm(e.situation_label)),dup=sis.find(x=>norm(x.platform)===norm(e.platform));if(dup)return{problem_code:p,answer_code:dup.answer_code,warning:'这个组合已经有答案，请直接修改原答案'};if(!e.platform)return{problem_code:p,answer_code:`${p}-${s}`};const n=Math.max(0,...sis.map(x=>Number((x.answer_code||'').split('-')[2])||0))+1;return{problem_code:p,answer_code:`${p}-${s}-${n}`}}
    function norm(v){return String(v||'').trim().toLowerCase()}
    function edit(id){const old=id?state.data.items.find(x=>x.id===id):null;state.editor=old?{...old}:{id:null,answer_code:'',problem_code:'',problem_title:'',situation_label:'',platform:'',answer_text:'',image_key:null};state.image=null;renderEditor()}
    function renderEditor(){const e=state.editor,n=e.id?e:numbering(e),problems=distinct('problem_title'),situations=distinct('situation_label'),platforms=distinct('platform'),isEditor=state.data.user.role==="editor",title=isEditor?(e.id?'提出修改申请':'提出新增申请'):(e.id?'修改标准答案':'新增标准答案'),description=isEditor?'提交后由管理员审核，现有答案不会立即改变':'问题编号与答案编号会自动产生',submitLabel=isEditor?'提交审核':'保存并发布';modal(`<header><div><h2>${title}</h2><p>${description}</p></div><button onclick="app.closeModal()">×</button></header><div class="modal-grid"><label>答案编号<input id="answerCode" class="field readonly" readonly value="${esc(e.id?e.answer_code:n.answer_code)}"></label><label>问题编号<input id="problemCode" class="field readonly" readonly value="${esc(e.id?e.problem_code:n.problem_code)}"></label><label class="wide">问题名称<input class="field" list="problemOpts" value="${esc(e.problem_title)}" oninput="app.editorField('problem_title',this.value)"></label><label>情况<input class="field" list="situationOpts" value="${esc(e.situation_label)}" oninput="app.editorField('situation_label',this.value)"></label><label>平台（可留空）<input class="field" list="platformOpts" value="${esc(e.platform||'')}" oninput="app.editorField('platform',this.value)"></label><datalist id="problemOpts">${problems.map(x=>`<option value="${esc(x)}">`).join('')}</datalist><datalist id="situationOpts">${situations.map(x=>`<option value="${esc(x)}">`).join('')}</datalist><datalist id="platformOpts">${platforms.map(x=>`<option value="${esc(x)}">`).join('')}</datalist><div id="editorWarning" class="warning ${n.warning?'':'hidden'}">${esc(n.warning||'')}</div><label class="wide">标准答案<textarea class="field" oninput="app.editorField('answer_text',this.value)">${esc(e.answer_text)}</textarea></label><label class="wide">答案附图（最多一张）<input class="field" type="file" accept="image/*" onchange="app.chooseImage(this.files[0])"><small>${e.image_key?'已保留原有图片':'尚未选择图片'}</small></label></div><footer><button onclick="app.closeModal()">取消</button><button class="primary" onclick="app.saveEditor()">${submitLabel}</button></footer>`)}
    function editorField(k,v){state.editor[k]=v;if(!state.editor.id){const n=numbering(state.editor);$("answerCode").value=n.answer_code;$("problemCode").value=n.problem_code;const w=$("editorWarning");w.textContent=n.warning||'';w.classList.toggle('hidden',!n.warning)}}
    async function compress(file){if(!file||!file.type.startsWith('image/'))throw new Error('请选择图片');const bmp=await createImageBitmap(file);let scale=Math.min(1,1400/Math.max(bmp.width,bmp.height));const canvas=document.createElement('canvas');canvas.width=Math.round(bmp.width*scale);canvas.height=Math.round(bmp.height*scale);canvas.getContext('2d').drawImage(bmp,0,0,canvas.width,canvas.height);const blob=await new Promise(ok=>canvas.toBlob(ok,'image/webp',.82));return new File([blob],file.name.replace(/\.[^.]+$/,'')+'.webp',{type:'image/webp'})}
    async function chooseImage(file){try{notify('正在处理图片…');state.image=await compress(file);notify('图片已选择')}catch(e){notify(e.message)}}
    async function saveEditor(){try{const e={...state.editor};if(!e.problem_title.trim()||!e.situation_label.trim()||!e.answer_text.trim())throw new Error('请完整填写问题、情况和标准答案');if(state.image){const f=new FormData();f.set('image',state.image);e.image_key=(await request(null,f)).key}const result=await request({action:'saveAnswer',answer:e});closeModal();await load();notify(result.mode==='draft'?'申请已提交，等待管理员审核':'答案已发布')}catch(e){notify(e.message)}}
    function myDraftsModal(){const labels={pending:'待审核',approved:'已通过',rejected:'已退回'},drafts=state.data.my_drafts||[];modal(`<header><div><h2>我的申请</h2><p>管理员通过后才会更新正式答案</p></div><button onclick="app.closeModal()">×</button></header><div class="card-list">${drafts.length?drafts.map(x=>`<article class="card"><div><strong>${esc(x.proposed_json?.answer_code||'新增答案')}｜${esc(x.proposed_json?.problem_title||'')}</strong><small>${esc(x.proposed_json?.answer_text||'')}</small></div><b>${labels[x.status]||esc(x.status)}</b></article>`).join(''):'<div class="empty">目前没有申请记录</div>'}</div><footer><button class="primary" onclick="app.closeModal()">完成</button></footer>`)}
    function bulkModal(){modal(`<header><div><h2>批量整理答案</h2><p>已选择 ${state.selected.size} 笔；留空代表不修改</p></div><button onclick="app.closeModal()">×</button></header><div class="modal-grid"><label class="wide">问题分类<input id="bulkProblem" class="field" list="bp" placeholder="不修改；或选择／输入问题名称"></label><label>情况<input id="bulkSituation" class="field" list="bs" placeholder="不修改"></label><label>平台<input id="bulkPlatform" class="field" list="bpl" placeholder="不修改"><span><input id="bulkClear" type="checkbox"> 改为不分平台</span></label><datalist id="bp">${distinct('problem_title').map(x=>`<option value="${esc(x)}">`).join('')}</datalist><datalist id="bs">${distinct('situation_label').map(x=>`<option value="${esc(x)}">`).join('')}</datalist><datalist id="bpl">${distinct('platform').map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div><footer><button onclick="app.closeModal()">取消</button><button class="primary" onclick="app.saveBulk()">确认批量修改</button></footer>`)}
    async function saveBulk(){try{await request({action:'bulkUpdateAnswers',ids:[...state.selected],changes:{problem_title:$("bulkProblem").value,situation_label:$("bulkSituation").value,platform:$("bulkPlatform").value,clear_platform:$("bulkClear").checked}});state.selected.clear();closeModal();await load();notify('批量整理完成')}catch(e){notify(e.message)}}
    function orderModal(){const ps=problems();modal(`<header><div><h2>调整问题列表顺序</h2><p>移动后会自动重编问题编号与旗下答案编号</p></div><button onclick="app.closeModal()">×</button></header><div class="order-list">${ps.map((p,i)=>`<article class="order-row"><b>${i+1}</b><div><strong>${esc(p.code)}｜${esc(p.title)}</strong><small>${p.items.length} 笔答案</small></div><button ${i===0?'disabled':''} onclick="app.move('${esc(p.code)}','up')">↑ 上移</button><button ${i===ps.length-1?'disabled':''} onclick="app.move('${esc(p.code)}','down')">↓ 下移</button></article>`).join('')}</div><footer><button class="primary" onclick="app.closeModal()">完成</button></footer>`)}
    async function move(code,direction){try{await request({action:'moveProblem',problem_code:code,direction});await load();orderModal();notify('问题已移动并重新编号')}catch(e){notify(e.message)}}
    async function remove(id){if(!confirm('确定删除这笔答案？'))return;try{await request({action:'deleteAnswer',id});state.selected.delete(id);await load();notify('已移入回收站')}catch(e){notify(e.message)}}
    async function restore(id){try{await request({action:'restoreAnswer',id});await load();notify('答案已恢复')}catch(e){notify(e.message)}}
    async function createUser(){try{await request({action:'createUser',username:$("newUsername").value,display_name:$("newDisplay").value,password:$("newPassword").value,role:$("newRole").value});await load();notify('账号已建立')}catch(e){notify(e.message)}}
    async function updateUser(id,role,status){try{await request({action:'updateUser',id,role,status});await load();notify('权限已更新')}catch(e){notify(e.message)}}
    async function resetPassword(id,name){const password=prompt(`为 ${name} 设置新密码（至少 8 个字符）`);if(!password)return;try{await request({action:'resetPassword',id,password});notify('密码已重置')}catch(e){notify(e.message)}}
    async function draft(id,approve){try{await request({action:approve?'approveDraft':'rejectDraft',id});await load();notify(approve?'草稿已发布':'草稿已退回')}catch(e){notify(e.message)}}
    async function restoreHistory(id){try{await request({action:'restoreHistory',id});await load();notify('已恢复历史版本')}catch(e){notify(e.message)}}
    Object.assign(window,{app:{problem:c=>{state.problem=c;state.situation=null;state.platform=null;render()},situation:s=>{state.situation=s;state.platform=null;render()},platform:p=>{state.platform=p;render()},copyText,copyBoth,openAdmin,closeAdmin,tab:k=>{state.adminTab=k;renderAdmin()},select:(id,on)=>{on?state.selected.add(id):state.selected.delete(id);renderAdmin()},selectAll:on=>{state.selected=new Set(on?state.data.items.map(x=>x.id):[]);renderAdmin()},clearSelection:()=>{state.selected.clear();renderAdmin()},edit,editorField,chooseImage,saveEditor,myDraftsModal,closeModal,bulkModal,saveBulk,orderModal,move,remove,restore,createUser,updateUser,resetPassword,draft,restoreHistory}});
    $("searchInput").addEventListener("input",e=>{state.query=e.target.value;render()});$("editorCreateButton").onclick=()=>edit();$("myDraftsButton").onclick=myDraftsModal;$("adminButton").onclick=openAdmin;$("logoutButton").onclick=async()=>{await supabase.auth.signOut();state.data=null;showLogin()};$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginError").textContent="";const {error}=await supabase.auth.signInWithPassword({email:usernameEmail($("loginUser").value),password:$("loginPassword").value});if(error){$("loginError").textContent="账号或密码不正确";return}try{showApp();await load()}catch(err){$("loginError").textContent=err.message;showLogin()}};
    const initial=await session();if(initial){showApp();try{await load()}catch{showLogin()}}else showLogin();setInterval(()=>{if(state.data)load().catch(()=>{})},30000);
  </script>
