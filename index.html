<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>标准答案中心</title>
    <style>
      :root {
        --primary: #3568f4;
        --primary2: #5b7df7;
        --bg: #eef3fb;
        --panel: #fff;
        --soft: #f6f8fc;
        --line: #d9e1ef;
        --text: #11213c;
        --muted: #6b7890;
        --danger: #dc3d4f;
        --shadow: 0 16px 46px rgba(24, 44, 84, 0.14);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Inter, "Microsoft YaHei", system-ui, sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      .hidden {
        display: none !important;
      }
      .login {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 20% 10%, #dce7ff, transparent 32%),
          linear-gradient(145deg, #eef4ff, #f7f9fd);
      }
      .login-card {
        width: min(430px, 94vw);
        padding: 34px;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand-icon {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 14px;
        color: #fff;
        background: linear-gradient(135deg, var(--primary), #7457ef);
        font-weight: 900;
      }
      .login h1 {
        margin: 22px 0 7px;
        font-size: 28px;
      }
      .login p {
        margin: 0 0 22px;
        color: var(--muted);
      }
      .login label {
        display: grid;
        gap: 7px;
        margin: 13px 0;
        color: var(--muted);
        font-size: 13px;
      }
      .field {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 12px;
        color: var(--text);
        background: var(--soft);
        outline: 0;
      }
      .field:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(53, 104, 244, 0.12);
      }
      .primary {
        border: 0 !important;
        color: #fff !important;
        background: var(--primary) !important;
      }
      .login button {
        width: 100%;
        margin-top: 12px;
        border: 0;
        border-radius: 11px;
        padding: 12px;
      }
      .error {
        min-height: 21px;
        margin-top: 10px;
        color: var(--danger);
        font-size: 13px;
      }
      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-rows: 68px 1fr;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      .top-actions {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .top-actions button,
      .ghost {
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 8px 12px;
        color: var(--text);
        background: var(--panel);
      }
      .avatar {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        color: #fff;
        background: var(--primary);
        font-weight: 800;
      }
      .workspace {
        display: grid;
        grid-template-columns: 300px 330px minmax(420px, 1fr);
        min-height: 0;
      }
      .problem-pane,
      .choice-pane,
      .answer-pane {
        min-width: 0;
        border-right: 1px solid var(--line);
        background: var(--panel);
      }
      .problem-pane {
        padding: 18px;
        background: var(--soft);
      }
      .search {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 9px 11px;
        background: var(--panel);
      }
      .search input {
        width: 100%;
        border: 0;
        outline: 0;
        background: transparent;
      }
      .pane-title {
        display: flex;
        justify-content: space-between;
        margin: 10px 4px;
        color: var(--muted);
        font-size: 13px;
      }
      .problem-list {
        display: grid;
        gap: 7px;
        max-height: calc(100vh - 160px);
        overflow: auto;
      }
      .problem {
        display: grid;
        grid-template-columns: 32px 1fr;
        gap: 9px;
        border: 1px solid transparent;
        border-radius: 11px;
        padding: 11px;
        text-align: left;
        color: var(--text);
        background: transparent;
      }
      .problem.active {
        border-color: #c9d7ff;
        background: #e5ecff;
      }
      .problem b:first-child {
        color: var(--primary);
        font-size: 17px;
      }
      .problem span {
        display: grid;
        gap: 3px;
      }
      .problem small {
        color: var(--muted);
      }
      .choice-pane {
        padding: 26px 24px;
      }
      .current-label {
        color: var(--muted);
        font-size: 12px;
      }
      .choice-pane h2 {
        margin: 8px 0 22px;
      }
      .choice-block {
        padding: 20px 0;
        border-top: 1px solid var(--line);
      }
      .choice-head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 13px;
      }
      .choice-head b {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        color: #fff;
        background: var(--primary);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chip {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 9px 14px;
        color: var(--text);
        background: var(--panel);
      }
      .chip.active {
        border-color: var(--primary);
        color: #fff;
        background: var(--primary);
      }
      .answer-pane {
        padding: 28px;
        overflow: auto;
      }
      .answer-card {
        max-width: 860px;
        margin: auto;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--panel);
        box-shadow: 0 8px 28px rgba(23, 42, 77, 0.08);
        overflow: hidden;
      }
      .answer-meta {
        padding: 20px 24px;
        border-bottom: 1px solid var(--line);
      }
      .answer-meta small {
        color: var(--muted);
      }
      .answer-meta h2 {
        margin: 8px 0 0;
      }
      .answer-body {
        padding: 24px;
      }
      .answer-image {
        display: block;
        max-width: min(100%, 620px);
        max-height: 520px;
        margin: 0 auto 22px;
        border-radius: 12px;
        object-fit: contain;
      }
      .answer-text {
        white-space: pre-wrap;
        line-height: 1.8;
      }
      .copy-actions {
        display: flex;
        gap: 10px;
        margin-top: 22px;
      }
      .copy-actions button {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 15px;
        color: var(--text);
        background: var(--panel);
      }
      .empty {
        display: grid;
        place-items: center;
        min-height: 300px;
        color: var(--muted);
      }
      .admin {
        position: fixed;
        inset: 0;
        z-index: 50;
        overflow: auto;
        background: var(--bg);
      }
      .admin-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 24px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      .admin-head h2 {
        margin: 0;
      }
      .admin-tabs {
        display: flex;
        gap: 7px;
        padding: 14px 24px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      .admin-tabs button {
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 8px 12px;
        color: var(--text);
        background: var(--panel);
      }
      .admin-tabs button.active {
        color: #fff;
        background: var(--primary);
      }
      .admin-content {
        padding: 22px;
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }
      .toolbar h3 {
        margin: 0;
      }
      .toolbar-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .toolbar button,
      .row-actions button,
      .modal footer button,
      .order-row button {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 11px;
        color: var(--text);
        background: var(--panel);
      }
      .bulkbar {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
        border: 1px solid #bdcdfd;
        border-radius: 10px;
        padding: 10px 12px;
        background: #edf2ff;
      }
      .bulkbar span {
        flex: 1;
        color: var(--muted);
      }
      .tablewrap {
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 900px;
      }
      th,
      td {
        padding: 11px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
        font-size: 13px;
      }
      th {
        color: var(--muted);
        background: var(--soft);
      }
      td.answer-cell {
        max-width: 360px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .selected td {
        background: #f0f4ff;
      }
      .danger {
        color: var(--danger) !important;
      }
      .row-actions {
        display: flex;
        gap: 6px;
      }
      .modalback {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        padding: 22px;
        background: rgba(8, 18, 37, 0.64);
      }
      .modal {
        width: min(760px, 94vw);
        max-height: 92vh;
        overflow: auto;
        border-radius: 18px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }
      .modal header,
      .modal footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 17px 20px;
        border-bottom: 1px solid var(--line);
      }
      .modal footer {
        justify-content: flex-end;
        gap: 8px;
        border-top: 1px solid var(--line);
        border-bottom: 0;
      }
      .modal h2,
      .modal p {
        margin: 0;
      }
      .modal p {
        margin-top: 4px;
        color: var(--muted);
        font-size: 13px;
      }
      .modal-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        padding: 20px;
      }
      .modal-grid label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
      }
      .wide {
        grid-column: 1/-1;
      }
      .modal textarea {
        min-height: 120px;
        resize: vertical;
      }
      .readonly {
        color: var(--primary);
        font-weight: 800;
      }
      .warning {
        grid-column: 1/-1;
        border: 1px solid #f4b23a;
        border-radius: 9px;
        padding: 10px;
        color: #8a5100;
        background: #fff9e9;
      }
      .order-list,
      .card-list {
        display: grid;
        gap: 8px;
        padding: 18px;
      }
      .order-row,
      .card {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        background: var(--soft);
      }
      .order-row div,
      .card div {
        flex: 1;
        display: grid;
        gap: 3px;
      }
      .order-row small,
      .card small {
        color: var(--muted);
      }
      .user-form {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 150px auto;
        gap: 8px;
        margin-bottom: 15px;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 22px;
        z-index: 200;
        padding: 10px 16px;
        border-radius: 999px;
        color: #fff;
        background: #172236;
        opacity: 0;
        transform: translate(-50%, 14px);
        transition: 0.2s;
        pointer-events: none;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      @media (max-width: 1050px) {
        .workspace {
          grid-template-columns: 240px 280px 1fr;
        }
        .user-form {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (max-width: 760px) {
        .workspace {
          grid-template-columns: 1fr;
        }
        .problem-pane,
        .choice-pane {
          border-bottom: 1px solid var(--line);
        }
        .problem-list {
          max-height: 260px;
        }
        .modal-grid {
          grid-template-columns: 1fr;
        }
        .wide {
          grid-column: auto;
        }
        .topbar {
          padding: 0 12px;
        }
        .top-actions span:not(.avatar) {
          display: none;
        }
      }
      .user-form {
        grid-template-columns: 1fr 1fr 1fr 150px auto auto;
      }
      .card > .row-actions {
        flex: 0;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .credential-box {
        display: grid;
        gap: 10px;
        padding: 20px;
      }
      .credential-row {
        display: grid;
        grid-template-columns: 80px 1fr;
        gap: 12px;
        align-items: center;
      }
      .credential-row code {
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--soft);
        word-break: break-all;
      }
      .tag-card {
        display: grid;
        grid-template-columns: minmax(180px, 1fr) minmax(260px, 2fr) auto;
      }
      .tag-card > div {
        display: grid;
        gap: 3px;
      }
      .favorite-active {
        border-color: #f3b51b !important;
        color: #8a5700 !important;
        background: #fff8df !important;
      }
      .list-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        margin: 13px 0 10px;
      }
      .list-tabs button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 9px;
        color: var(--text);
        background: var(--panel);
      }
      .list-tabs button.active {
        border-color: var(--primary);
        color: #fff;
        background: var(--primary);
      }
      .list-tabs b {
        display: inline-grid;
        place-items: center;
        min-width: 20px;
        height: 20px;
        border-radius: 999px;
        padding: 0 6px;
        color: inherit;
        background: rgba(107, 120, 144, 0.14);
        font-size: 12px;
      }
      .list-tabs button.active b {
        background: rgba(255, 255, 255, 0.2);
      }
      .favorite-row {
        display: grid;
        grid-template-columns: 52px 1fr auto;
        gap: 9px;
        align-items: center;
        border: 1px solid transparent;
        border-radius: 11px;
        padding: 11px;
        text-align: left;
        color: var(--text);
        background: transparent;
      }
      .favorite-row:hover,
      .favorite-row.active {
        border-color: #c9d7ff;
        background: #e5ecff;
      }
      .favorite-row > b {
        color: var(--primary);
      }
      .favorite-row span {
        display: grid;
        gap: 3px;
        min-width: 0;
      }
      .favorite-row small {
        color: var(--muted);
      }
      .favorite-row > i {
        color: var(--primary);
        font-style: normal;
      }
      .favorite-row > span,
      .favorite-row > b {
        cursor: pointer;
      }
      .favorite-row-actions {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .favorite-row-actions button {
        min-width: 28px;
        min-height: 28px;
        border: 1px solid #d5def0;
        border-radius: 7px;
        padding: 3px 7px;
        color: var(--primary);
        background: #fff;
        line-height: 1;
      }
      .favorite-row-actions button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .favorite-empty {
        display: grid;
        place-items: center;
        min-height: 180px;
        padding: 20px;
        text-align: center;
        color: var(--muted);
      }
      @media (max-width: 760px) {
        .tag-card {
          grid-template-columns: 1fr;
        }
      }
      .choice-head b {
        flex: 0 0 28px;
      }
      .choice-head span {
        display: grid;
        gap: 3px;
      }
      .choice-head small {
        color: var(--muted);
        font-weight: 400;
      }
      .answer-list-head {
        max-width: 920px;
        margin: 0 auto 14px;
      }
      .answer-list-head > div {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .answer-list-head small {
        color: var(--muted);
      }
      .answer-list {
        display: grid;
        gap: 16px;
        max-width: 920px;
        margin: auto;
        padding-bottom: 28px;
      }
      .answer-list .answer-card {
        max-width: none;
        margin: 0;
      }
      .answer-card.prioritized {
        border-color: #9bb3ff;
        box-shadow: 0 10px 30px rgba(53, 104, 244, 0.14);
      }
      .workspace {
        height: calc(100vh - 68px);
        grid-template-columns: 260px minmax(0, 1fr);
        grid-template-rows: auto minmax(0, 1fr);
      }
      .problem-pane {
        grid-row: 1/3;
        padding: 14px 12px;
      }
      .problem-list {
        max-height: calc(100vh - 180px);
      }
      .choice-pane {
        grid-column: 2;
        grid-row: 1;
        display: grid;
        grid-template-columns:
          180px minmax(220px, 1fr) minmax(320px, 1.4fr)
          80px;
        align-items: center;
        gap: 18px;
        padding: 10px 18px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .compact-current {
        display: grid;
        gap: 3px;
      }
      .compact-current small,
      .compact-filter-group small {
        color: var(--muted);
        font-size: 11px;
      }
      .compact-current h2 {
        margin: 0;
        font-size: 19px;
      }
      .compact-current h2 span {
        color: var(--primary);
      }
      .compact-current .situation-order-button {
        width: fit-content;
        border: 1px solid #b9c8f8;
        border-radius: 7px;
        padding: 4px 7px;
        color: var(--primary);
        background: #f6f8ff;
        font-size: 11px;
      }
      .compact-filter-group {
        display: grid;
        gap: 6px;
      }
      .compact-filter-group .chips {
        gap: 5px;
      }
      .compact-filter-group .chip {
        padding: 6px 10px;
        font-size: 12px;
      }
      .compact-total {
        display: grid;
        justify-items: center;
        gap: 1px;
        border-left: 1px solid var(--line);
      }
      .compact-total b {
        color: var(--primary);
        font-size: 22px;
      }
      .compact-total small {
        color: var(--muted);
        font-size: 10px;
      }
      .answer-pane {
        grid-column: 2;
        grid-row: 2;
        padding: 12px 16px;
        border-right: 0;
        background: var(--bg);
      }
      .answer-groups {
        display: grid;
        gap: 12px;
        max-width: none;
        margin: 0;
        padding-bottom: 18px;
      }
      .answer-group {
        border: 1px solid var(--line);
        border-radius: 11px;
        overflow: hidden;
        background: var(--panel);
      }
      .answer-group.active {
        border-color: #a9baff;
        box-shadow: 0 5px 18px rgba(53, 104, 244, 0.08);
      }
      .answer-group > header {
        display: flex;
        height: 42px;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
        border-bottom: 1px solid var(--line);
        background: var(--soft);
      }
      .answer-group > header > div {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .answer-group > header span {
        display: grid;
        width: 24px;
        height: 24px;
        place-items: center;
        border-radius: 7px;
        color: #fff;
        background: var(--primary);
        font-size: 11px;
      }
      .answer-group > header small {
        color: var(--muted);
        font-size: 10px;
      }
      .answer-group > header em {
        color: var(--primary);
        font-size: 10px;
        font-style: normal;
      }
      .answer-row {
        display: grid;
        min-height: 51px;
        grid-template-columns: 68px 76px minmax(240px, 1fr) 42px auto;
        align-items: center;
        gap: 8px;
        padding: 7px 12px;
        border-top: 1px solid var(--line);
        font-size: 12px;
      }
      .answer-row:first-child {
        border-top: 0;
      }
      .answer-row > strong {
        color: var(--primary);
      }
      .answer-platform {
        display: inline-block;
        border: 1px solid transparent;
        border-radius: 99px;
        padding: 4px 7px;
        color: #3154c7;
        text-align: center;
        background: #e9efff;
        font-size: 11px;
        white-space: nowrap;
      }
      .answer-platform:hover,
      .answer-platform:focus-visible {
        border-color: #8aa4ff;
        background: #dfe8ff;
        outline: 0;
      }
      .answer-platform:active {
        transform: translateY(1px);
      }

    <div id="announcementRoot"></div>

    <div id="toast" class="toast"></div>
    <script type="module">
      import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
      const SB_URL = "https://ehunehldizwnissqjnmo.supabase.co";
      const SB_KEY = "sb_publishable_V2SulLXaBuXNVAOuPwR6kQ_FlN0w7dM";
      const API = SB_URL + "/functions/v1/team-api";
      const supabase = createClient(SB_URL, SB_KEY, {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: false,
        },
      });
      const PLATFORM_ORDER = ["现金", "棋牌", "体育", "棋牌APP"];
      function platformSortRank(platform) {
        const index = PLATFORM_ORDER.indexOf(String(platform || "").trim());
        return index < 0 ? PLATFORM_ORDER.length : index;
      }
      const state = {
        data: null,
        query: "",
        problem: null,
        situation: null,
        platform: null,
        listMode: "problems",
        adminTab: "answers",
        adminProblem: "all",
        draftFilter: "unprocessed",
        selected: new Set(),
        editor: null,
        image: null,
        announcementEditor: null,
        announcementFilter: "published",
        dragFavoriteId: null,
        suppressFavoriteClick: false,
      };
      const $ = (id) => document.getElementById(id);
      const esc = (v) =>
        String(v ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const usernameEmail = (u) =>
        u.trim().toLowerCase() + "@team-answer.local";
      function notify(message) {
        const t = $("toast");
        t.textContent = message;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 2400);
      }
      function beginBusy(busyLabel = "处理中...") {
        const button =
          document.activeElement instanceof HTMLButtonElement
            ? document.activeElement
            : null;
        if (!button || button.disabled) return () => {};
        const originalLabel = button.textContent;
        button.disabled = true;
        button.textContent = busyLabel;
        return () => {
          if (!button.isConnected) return;
          button.disabled = false;
          button.textContent = originalLabel;
        };
      }
      async function session() {
        return (await supabase.auth.getSession()).data.session;
      }
      async function request(body = null, form = null) {
        const s = await session();
        if (!s) throw new Error("登录已失效");
        const options = {
          method: body || form ? "POST" : "GET",
          headers: {
            apikey: SB_KEY,
            Authorization: "Bearer " + s.access_token,
          },
        };
        if (body) {
          options.headers["content-type"] = "application/json";
          options.body = JSON.stringify(body);
        }
        if (form) options.body = form;
        const r = await fetch(API, options);
        const data = await r.json();
        if (r.status === 401) {
          await supabase.auth.signOut();
          showLogin();
          throw new Error("登录已失效");
        }
        if (!r.ok) throw new Error(data.error || "操作失败");
        return data;
      }
      async function load() {
        state.data = await request();
        const codes = new Set(state.data.items.map((x) => x.problem_code));
        if (!codes.has(state.problem))
          state.problem = state.data.items[0]?.problem_code || null;
        render();
        if (!$("adminView").classList.contains("hidden")) renderAdmin();
      }
      function problems(applySearch = true) {
        const map = new Map();
        for (const item of state.data?.items || []) {
          if (!map.has(item.problem_code))
            map.set(item.problem_code, {
              code: item.problem_code,
              title: item.problem_title,
              search_tags: item.search_tags || [],
              items: [],
            });
          map.get(item.problem_code).items.push(item);
        }
        const all = [...map.values()],
          raw = applySearch ? state.query.trim() : "";
        if (!raw) return all;
        const q = raw.toLowerCase(),
          numeric = /^[\d\s-]+$/.test(raw) && /\d/.test(raw),
          compact = raw.replace(/\D/g, ""),
          structured = raw
            .replace(/\s/g, "")
            .replace(/-+/g, "-")
            .replace(/^-|-$/g, "");
        return all
          .map((p) => {
            let matchedItems = [],
              exactAnswerId = null;
            const tagHit = p.search_tags.some((tag) =>
              String(tag).toLowerCase().includes(q),
            );
            if (numeric && !tagHit) {
              matchedItems = p.items.filter((i) => {
                const code = String(i.answer_code || ""),
                  codeCompact = code.replace(/\D/g, ""),
                  hit = raw.includes("-")
                    ? code === structured || code.startsWith(structured + "-")
                    : codeCompact.startsWith(compact);
                if (code === structured || codeCompact === compact)
                  exactAnswerId = Number(i.id);
                return hit;
              });
            } else {
              const problemHit = (
                p.code +
                " " +
                p.title +
                " " +
                p.search_tags.join(" ")
              )
                .toLowerCase()
                .includes(q);
              matchedItems = problemHit
                ? p.items
                : p.items.filter((i) =>
                    (
                      i.situation_label +
                      " " +
                      (i.platform || "") +
                      " " +
                      i.answer_text
                    )
                      .toLowerCase()
                      .includes(q),
                  );
            }
            return {
              ...p,
              matchedItems,
              exactAnswerId,
              numericSearch: numeric && !tagHit,
              problemOnly:
                tagHit ||
                (numeric && String(p.code).replace(/\D/g, "") === compact),
            };
          })
          .filter((p) => p.matchedItems.length);
      }
      function orderAnswers(items, exactId = null, matchedIds = new Set()) {
        return [...items].sort((a, b) => {
          const exactRank = (x) =>
              exactId ? (Number(x.id) === Number(exactId) ? 0 : 1) : 0,
            matchRank = (x) =>
              matchedIds.size ? (matchedIds.has(Number(x.id)) ? 0 : 1) : 0,
            situationRank = (x) =>
              state.situation
                ? x.situation_label === state.situation
                  ? 0
                  : 1
                : 0,
            selectedPlatformRank = (x) =>
              state.platform ? (x.platform === state.platform ? 0 : 1) : 0;
          return (
            exactRank(a) - exactRank(b) ||
            matchRank(a) - matchRank(b) ||
            situationRank(a) - situationRank(b) ||
            selectedPlatformRank(a) - selectedPlatformRank(b) ||
            platformSortRank(a.platform) - platformSortRank(b.platform) ||
            String(a.answer_code).localeCompare(
              String(b.answer_code),
              "zh-CN",
              { numeric: true },
            )
          );
        });
      }
      function current() {
        const ps = problems(state.listMode === "problems");
        const p = ps.find((x) => x.code === state.problem) || ps[0];
        if (!p) return {};
        state.problem = p.code;
        const hasQuery = state.listMode === "problems" && state.query.trim(),
          displayItems =
            hasQuery && p.numericSearch && !p.problemOnly && !p.exactAnswerId
              ? p.matchedItems
              : p.items,
          matchedIds = new Set((p.matchedItems || []).map((i) => Number(i.id))),
          situations = [...new Set(displayItems.map((i) => i.situation_label))];
        if (state.situation && !situations.includes(state.situation))
          state.situation = null;
        const platformItems = state.situation
            ? displayItems.filter((i) => i.situation_label === state.situation)
            : displayItems,
          platforms = [
            ...new Set(platformItems.map((i) => i.platform).filter(Boolean)),
          ].sort((a, b) => platformSortRank(a) - platformSortRank(b));
        if (state.platform && !platforms.includes(state.platform))
          state.platform = null;
        const orderedItems = orderAnswers(
          displayItems,
          p.exactAnswerId,
          matchedIds,
        );
        return {
          p,
          situations,
          items: displayItems,
          platforms,
          orderedItems,
          answer: orderedItems[0],
          matchedIds,
          exactAnswerId: p.exactAnswerId,
        };
      }
      function favoriteItems(applySearch = true) {
        const byId = new Map(
            (state.data?.items || []).map((x) => [Number(x.id), x]),
          ),
          q = applySearch ? state.query.trim().toLowerCase() : "";
        return (state.data?.favorites || [])
          .map((f) => byId.get(Number(f.answer_id)))
          .filter(
            (a) =>
              a &&
              (!q ||
                (
                  a.answer_code +
                  " " +
                  a.problem_title +
                  " " +
                  a.situation_label +
                  " " +
                  (a.platform || "") +
                  " " +
                  a.answer_text
                )
                  .toLowerCase()
                  .includes(q)),
          );
      }
      function render() {
        if (!state.data) return;
        const isEditor = state.data.user.role === "editor",
          isAdmin = state.data.user.role === "admin",
          favoriteIds = new Set(
            (state.data.favorites || []).map((x) => Number(x.answer_id)),
          ),
          ps = problems(state.listMode === "problems"),
          favorites = favoriteItems(),
          unreadCount = (state.data.unread_announcement_ids || []).length,
          matchedAnswerCount = ps.reduce(
            (total, problem) =>
              total + (problem.matchedItems?.length || problem.items.length),
            0,
          );
        $("userName").textContent = state.data.user.display_name;
        $("avatar").textContent = state.data.user.display_name.slice(0, 1);
        $("announcementCount").textContent = unreadCount;
        $("announcementCount").classList.toggle("hidden", !unreadCount);
        const problemCountLabel = state.query.trim()
          ? `${ps.length} 个问题 / ${matchedAnswerCount} 笔匹配`
          : `${problems(false).length} 个问题`;
        $("problemCount").textContent = problemCountLabel;
        $("problemsTab").title = state.query.trim()
          ? `找到 ${ps.length} 个问题／${matchedAnswerCount} 笔匹配`
          : "完整问题列表";
        $("favoriteCount").textContent = favoriteIds.size;
        $("problemsTab").classList.toggle(
          "active",
          state.listMode === "problems",
        );
        $("favoritesTab").classList.toggle(
          "active",
          state.listMode === "favorites",
        );
        $("searchInput").placeholder =
          state.listMode === "favorites"
            ? "搜索常用回答"
            : "搜索问题编号或关键词";
        $("editorCreateButton").classList.toggle("hidden", !isEditor);
        $("myDraftsButton").classList.toggle("hidden", !isEditor);
        $("adminButton").classList.toggle("hidden", !isAdmin);
        const c = current(),
          activeAnswerId = Number(c.answer?.id);
        $("problemList").innerHTML =
          state.listMode === "problems"
            ? ps
                .map(
                  (p) =>
                    `<button class="problem ${p.code === state.problem ? "active" : ""}" onclick="app.problem('${esc(p.code)}')"><b>${esc(p.code)}</b><span><strong>${esc(p.title)}</strong><small>${new Set(p.items.map((i) => i.situation_label)).size} 种情况 · ${p.items.length} 笔答案</small></span></button>`,
                )
                .join("")
            : favorites.length
              ? favorites
                  .map(

      async function copyBoth(id) {

          const dataUrl = await new Promise((ok, no) => {
            const f = new FileReader();
            f.onload = () => ok(f.result);
            f.onerror = no;
            f.readAsDataURL(source);
          });
          const image = await new Promise((ok, no) => {

          const canvas = document.createElement("canvas");

          const text = esc(a.answer_text).replace(/\n/g, "<br>");
          const html = `<div><img src="${dataUrl}"><br><div>${text}</div></div>`;
          await navigator.clipboard.write([
            new ClipboardItem({
              "image/png": png,
              "text/html": new Blob([html], { type: "text/html" }),
              "text/plain": new Blob([a.answer_text], { type: "text/plain" }),

          ]);

      async function favoriteDrop(event, targetId) {
        event.preventDefault();
        event.stopPropagation();
        const sourceId = Number(state.dragFavoriteId),
          destinationId = Number(targetId);
        document
          .querySelectorAll(".favorite-row.dragging,.favorite-row.drag-over")
          .forEach((row) => row.classList.remove("dragging", "drag-over"));
        if (!sourceId || sourceId === destinationId) return;
        const previous = (state.data.favorites || []).map((item) => ({
            ...item,
          })),
          order = previous.map((item) => Number(item.answer_id)),
          from = order.indexOf(sourceId),
          to = order.indexOf(destinationId);
        if (from < 0 || to < 0) return;
        order.splice(to, 0, order.splice(from, 1)[0]);
        state.dragFavoriteId = null;
        await saveFavoriteOrder(order, previous);

          from = order.indexOf(Number(id)),
          to = from + Number(direction);

        order.splice(to, 0, order.splice(from, 1)[0]);
        await saveFavoriteOrder(order, previous);

        } catch (e) {
          notify(e.message);
        } finally {
          done();
        }
      }
      function orderModal() {
        const ps = problems(false);
        modal(
          `<header><div><h2>调整问题列表顺序</h2><p>移动后会自动重编问题编号与旗下答案编号</p></div><button onclick="app.closeModal()">×</button></header><div class="order-list">${ps.map((p, i) => `<article class="order-row"><b>${i + 1}</b><div><strong>${esc(p.code)}｜${esc(p.title)}</strong><small>${p.items.length} 笔答案</small></div><button ${i === 0 ? "disabled" : ""} onclick="app.move('${esc(p.code)}','up')">↑ 上移</button><button ${i === ps.length - 1 ? "disabled" : ""} onclick="app.move('${esc(p.code)}','down')">↓ 下移</button></article>`).join("")}</div><footer><button class="primary" onclick="app.closeModal()">完成</button></footer>`,
        );
      }
      async function move(code, direction) {
        const done = beginBusy("移动中...");
        try {
          await request({
            action: "moveProblem",
            problem_code: code,
            direction,
          });
          await load();
          orderModal();
          notify("问题已移动并重新编号");
        } catch (e) {
          notify(e.message);
        } finally {
          done();
        }
      }
      function situationOrderModal() {
        const c = current();
        if (!c.p) return notify("请先选择问题");
        const situations = [
          ...new Set(c.p.items.map((item) => item.situation_label)),
        ];
        modal(
          `<header><div><h2>调整情况顺序</h2><p>${esc(c.p.code)}｜${esc(c.p.title)}；移动后会自动重编情况编号与答案编号</p></div><button onclick="app.closeModal()">×</button></header><div class="order-list">${situations.map((situation, index) => {
            const items = c.p.items.filter(
              (item) => item.situation_label === situation,
            );
            return `<article class="order-row"><b>${index + 1}</b><div><strong>${esc(situation)}</strong><small>${items.length} 笔答案</small></div><button ${index === 0 ? "disabled" : ""} onclick="app.moveSituation('${esc(c.p.code)}','${esc(situation)}','up')">↑ 上移</button><button ${index === situations.length - 1 ? "disabled" : ""} onclick="app.moveSituation('${esc(c.p.code)}','${esc(situation)}','down')">↓ 下移</button></article>`;
          }).join("")}</div><footer><button class="primary" onclick="app.closeModal()">完成</button></footer>`,
        );
      }
      async function moveSituation(problemCode, situationLabel, direction) {
        const done = beginBusy("调整情况顺序中...");
        try {
          await request({
            action: "moveSituation",
            problem_code: problemCode,
            situation_label: situationLabel,
            direction,
          });
          state.situation = null;
          await load();
          situationOrderModal();
          notify("情况已移动并重新编号");
        } catch (e) {
          notify(e.message);
        } finally {
          done();
        }
      }
      function parseSearchTags(value) {
        return String(value || "")
          .split(/[,，、;；\n]+/)
          .map((tag) => tag.trim())
          .filter(Boolean);
      }
      async function saveProblemTags(code) {
        const value = $("tagInput_" + code).value;
        const done = beginBusy("保存中...");
        try {
          await request({
            action: "updateProblemTags",
            problem_code: code,
            search_tags: parseSearchTags(value),
          });
          await load();
          notify("搜索标注已保存");
        } catch (e) {
          notify(e.message);
        } finally {
          done();
        }
      }
      async function remove(id) {
        if (!confirm("确定删除这笔答案？")) return;
        try {
          await request({ action: "deleteAnswer", id });
          state.selected.delete(id);
          await load();
          notify("已移入回收站");
        } catch (e) {
          notify(e.message);
        }
      }
      async function restore(id) {
        try {
          await request({ action: "restoreAnswer", id });
          await load();
          notify("答案已恢复");
        } catch (e) {
          notify(e.message);
        }
      }
      function randomIndex(max) {
        const values = new Uint32Array(1);
        crypto.getRandomValues(values);
        return values[0] % max;
      }
      function generatePassword() {
        const lower = "abcdefghjkmnpqrstuvwxyz",
          upper = "ABCDEFGHJKMNPQRSTUVWXYZ",
          digits = "23456789",
          symbols = "!@#$%";
        const all = lower + upper + digits + symbols,
          chars = [
            lower[randomIndex(lower.length)],
            upper[randomIndex(upper.length)],
            digits[randomIndex(digits.length)],
            symbols[randomIndex(symbols.length)],
          ];
        while (chars.length < 14) chars.push(all[randomIndex(all.length)]);
        for (let i = chars.length - 1; i > 0; i--) {
          const j = randomIndex(i + 1);
          [chars[i], chars[j]] = [chars[j], chars[i]];
        }
        return chars.join("");
      }
      function randomAccount() {
        const digits = String(randomIndex(1000000)).padStart(6, "0");
        $("newUsername").value = `staff${digits}`;
        $("newDisplay").value = `员工${digits.slice(-4)}`;
        $("newPassword").value = generatePassword();
        $("newPassword").type = "text";
        $("newRole").value = "viewer";
        notify("已生成账号与密码");
      }
      function credentialText(username, password) {
        return `标准答案中心\n账号：${username}\n密码：${password}\n网址：${location.origin}${location.pathname}`;
      }
      async function copyCredentials(username, password) {
        await navigator.clipboard.writeText(credentialText(username, password));
        notify("账号密码已复制");
      }
      function credentialModal(username, password, title = "账号已建立") {
        state.credentials = { username, password };
        modal(
          `<header><div><h2>${title}</h2><p>密码只在这里显示，请立即复制并交给使用者</p></div><button onclick="app.closeModal()">×</button></header><div class="credential-box"><div class="credential-row"><b>账号</b><code>${esc(username)}</code></div><div class="credential-row"><b>密码</b><code>${esc(password)}</code></div></div><footer><button onclick="app.closeModal()">完成</button><button class="primary" onclick="app.copyCurrentCredentials()">一键复制账号密码</button></footer>`,
        );
      }
      function copyCurrentCredentials() {
        return copyCredentials(
          state.credentials.username,
          state.credentials.password,
        );
      }
      async function createUser() {
        const username = $("newUsername").value.trim(),
          display_name = $("newDisplay").value.trim(),
          password = $("newPassword").value,
          role = $("newRole").value;
        try {
          await request({
            action: "createUser",
            username,
            display_name,
            password,
            role,
          });
          await load();
          credentialModal(username, password);
          notify("账号已建立");
        } catch (e) {
          notify(e.message);
        }
      }
      async function updateUser(id, role, status) {
        try {
          await request({ action: "updateUser", id, role, status });
          await load();
          notify("权限已更新");
        } catch (e) {
          notify(e.message);
        }
      }
      async function resetPassword(id) {
        const user = (state.data.users || []).find((x) => x.id === id),
          password = prompt(
            `为 ${user?.display_name || "这个账号"} 设置新密码（至少 8 个字符）`,
          );
        if (!password) return;
        try {
          await request({ action: "resetPassword", id, password });
          notify("密码已重置");
        } catch (e) {
          notify(e.message);
        }
      }
      async function resetAndCopy(id, username) {
        if (!confirm(`确定为 ${username} 生成新密码？旧密码会立即失效。`))
          return;
        const password = generatePassword();
        try {
          await request({ action: "resetPassword", id, password });
          credentialModal(username, password, "新密码已产生");
          try {
            await copyCredentials(username, password);
          } catch {
            notify("新密码已产生，请在窗口内手动复制");
          }
        } catch (e) {
          notify(e.message);
        }
      }
      async function deleteUser(id, username) {
        if (
          !confirm(
            `确定删除账号 ${username}？\n\n删除后会立即停止使用，过去的答案与操作记录会保留。`,
          )
        )
          return;
        try {
          await request({ action: "deleteUser", id });
          await load();
          notify("账号已删除");
        } catch (e) {
          notify(e.message);
        }
      }
      function setAdminDraftFilter(status) {
        state.draftFilter = status;
        renderAdmin();
      }
      function setAnnouncementFilter(status) {
        state.announcementFilter = status;
        renderAdmin();
      }
      function openDraftInAnswerManager(id) {
        const draft = (state.data.drafts || []).find(
          (item) => Number(item.id) === Number(id),
        );
        if (!draft) return notify("找不到这笔申请");
        const before = draft.original_json || {},
          after = draft.proposed_json || {},
          originalId = Number(after.id || before.id),
          original = (state.data.items || []).find(
            (item) => Number(item.id) === originalId,
          );
        state.adminTab = "answers";
        state.adminProblem = after.problem_code || before.problem_code || "all";
        state.editor = {
          ...(original || {}),
          ...after,
          id: draft.request_type === "edit" ? original?.id || originalId : null,
          answer_code:
            draft.request_type === "edit"
              ? original?.answer_code || after.answer_code || ""
              : "",
          problem_code:
            draft.request_type === "edit"
              ? original?.problem_code || after.problem_code || ""
              : "",
          image_key: after.image_key ?? original?.image_key ?? null,
          request_type: null,
          request_reason: "",
          request_reason_detail: "",
          member_question: "",
        };
        state.image = null;
        renderAdmin();
        renderEditor();
      }
      function processDraftModal(id) {
        modal(
          `<header><div><h2>标记申请已处理</h2><p>请先在答案管理手动完成需要的新增或修改</p></div><button onclick="app.closeModal()">×</button></header><div class="modal-grid"><label class="wide">管理员备注（选填）<textarea id="draftReviewNote" class="field" placeholder="例如：已新增答案，或说明不加入答案库的原因"></textarea></label></div><footer><button onclick="app.closeModal()">取消</button><button class="primary" onclick="app.processDraft(${id})">确认已处理</button></footer>`,
        );
      }
      async function processDraft(id) {
        const done = beginBusy("处理中...");
        try {
          await request({
            action: "markDraftProcessed",
            id,
            review_note: $("draftReviewNote").value,
          });
          closeModal();
          await load();
          renderAdmin();
          notify("申请已标记为已处理");
        } catch (e) {
          notify(e.message);
        } finally {
          done();
        }
      }
      function announcementEdit(id) {
        const old = id
          ? (state.data.all_announcements || []).find(
              (item) => Number(item.id) === Number(id),
            )
          : null;
        state.announcementEditor = old
          ? { ...old }
          : {
              id: null,
              title: "",
              body: "",
              image_key: null,
              is_pinned: false,
            };
        state.image = null;
        const e = state.announcementEditor;
        modal(
          `<header><div><h2>${e.id ? "修改公告" : "发布公告"}</h2><p>所有使用者都会看到这则公告</p></div><button onclick="app.closeModal()">×</button></header><div class="modal-grid"><label class="wide">公告标题<input id="announcementTitle" class="field" value="${esc(e.title)}"></label><label class="wide">公告内容<textarea id="announcementBody" class="field">${esc(e.body)}</textarea></label><label class="wide">公告图片（最多一张）<input class="field" type="file" accept="image/*" onchange="app.chooseImage(this.files[0])"><small>${e.image_key ? "已保留原有图片" : "尚未选择图片"}</small></label><label class="wide"><span><input id="announcementPinned" type="checkbox" ${e.is_pinned ? "checked" : ""}> 置顶公告</span></label></div><footer><button onclick="app.closeModal()">取消</button><button class="primary" onclick="app.saveAnnouncement()">${e.id ? "保存并重新通知" : "发布公告"}</button></footer>`,
        );
      }
      async function saveAnnouncement() {
        const done = beginBusy("发布中...");
        try {
          const e = { ...state.announcementEditor };
          e.title = $("announcementTitle").value;
          e.body = $("announcementBody").value;
          e.is_pinned = $("announcementPinned").checked;
          if (state.image) {
            const f = new FormData();
            f.set("image", state.image);
            e.image_key = (await request(null, f)).key;
          }
          await request({ action: "saveAnnouncement", ...e });
          closeModal();
          await load();
          renderAdmin();
          notify(e.id ? "公告已更新" : "公告已发布");
        } catch (e) {
          notify(e.message);
        } finally {
          done();
        }
      }
      async function archiveAnnouncement(id) {
        if (!confirm("确定下架这则公告？")) return;
        const done = beginBusy("下架中...");
        try {
          await request({ action: "archiveAnnouncement", id });
          await load();
          renderAdmin();
          notify("公告已下架");
        } catch (e) {
          notify(e.message);
        } finally {
          done();
        }
      }
      async function restoreHistory(id) {
        try {
          await request({ action: "restoreHistory", id });
          await load();
          notify("已恢复历史版本");
        } catch (e) {
          notify(e.message);
        }
      }
      Object.assign(window, {
        app: {
          problem: (c) => {
            state.problem = c;
            state.situation = null;
            state.platform = null;
            render();
          },
          situation: (s) => {
            state.situation = state.situation === s ? null : s;
            state.platform = null;
            render();
          },
          platform: (p) => {
            state.platform = state.platform === p ? null : p;
            render();
          },
          listMode,
          clearSearch,
          previewImage,
          copyText,
          copyBoth,
          closeAnnouncements,
          previewAnnouncementImage,
          readAnnouncement,
          toggleFavorite,
          favoriteDragStart,
          favoriteDragOver,
          favoriteDragEnd,
          favoriteDrop,
          moveFavorite,
          openFavorite,
          openAdmin,
          closeAdmin,
          tab: (k) => {
            state.adminTab = k;
            renderAdmin();
          },
          adminProblem: setAdminProblem,
          select: (id, on) => {
            on ? state.selected.add(id) : state.selected.delete(id);
            renderAdmin();
          },
          selectAll: (on) => {
            for (const item of adminAnswerItems())
              on ? state.selected.add(item.id) : state.selected.delete(item.id);
            renderAdmin();
          },
          clearSelection: () => {
            state.selected.clear();
            renderAdmin();
          },
          edit,
          startRequest,
          notifyRequestEdit: () => notify("请在要修正的答案右侧点击“申请修改”"),
          editDraft,
          editorField,
          chooseImage,
          chooseBulkImage,
          saveEditor,
          myDraftsModal,
          draftFilter: setDraftFilter,
          cancelDraft,
          closeModal,
          bulkModal,
          saveBulk,
          bulkImageModal,
          saveBulkImage,
          orderModal,
          move,
          situationOrderModal,
          moveSituation,
          saveProblemTags,
          remove,
          restore,
          randomAccount,
          copyCredentials,
          copyCurrentCredentials,
          createUser,
          updateUser,
          resetPassword,
          resetAndCopy,
          deleteUser,
          adminDraftFilter: setAdminDraftFilter,
          announcementFilter: setAnnouncementFilter,
          openDraftInAnswerManager,
          processDraftModal,
          processDraft,
          announcementEdit,
          saveAnnouncement,
          archiveAnnouncement,
          restoreHistory,
        },
      });
      const favoriteListObserver = new MutationObserver(() => {
        if (state.listMode === "favorites") enableFavoriteSorting();
      });
      favoriteListObserver.observe($("problemList"), { childList: true });
      const platformToneObserver = new MutationObserver(applyPlatformTones);
      platformToneObserver.observe($("answerPane"), {
        childList: true,
        subtree: true,
      });
      $("searchInput").addEventListener("input", (e) => {
        state.query = e.target.value;
        render();
      });
      $("editorCreateButton").onclick = () => edit();
      $("myDraftsButton").onclick = myDraftsModal;
      $("announcementsButton").onclick = openAnnouncements;
      $("adminButton").onclick = openAdmin;
      $("logoutButton").onclick = async () => {
        await supabase.auth.signOut();
        state.data = null;
        showLogin();
      };
      $("loginForm").onsubmit = async (e) => {
        e.preventDefault();
        $("loginError").textContent = "";
        const { error } = await supabase.auth.signInWithPassword({
          email: usernameEmail($("loginUser").value),
          password: $("loginPassword").value,
        });
        if (error) {
          $("loginError").textContent = "账号或密码不正确";
          return;
        }
        try {
          showApp();
          await load();
        } catch (err) {
          $("loginError").textContent = err.message;
          showLogin();
        }
      };
      const initial = await session();
      if (initial) {
        showApp();
        try {
          await load();
        } catch {
          showLogin();
        }
      } else showLogin();
      setInterval(() => {
        if (state.data) load().catch(() => {});
      }, 30000);
    </script>
  </body>
</html>
